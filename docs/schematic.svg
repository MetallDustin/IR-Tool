<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680">
  <title>IR-Tool Schaltplan für ESP8266 D1 mini Pro</title>
  <desc>D1 mini Pro mit IR-Empfänger an D5 und IR-LED über NPN-Transistor an D6</desc>
  <rect width="1100" height="680" fill="#ffffff"/>
  <style>
    .wire{stroke:#1f2937;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#1f2937;stroke-width:2;fill:none}
    .box{fill:#eef2ff;stroke:#3730a3;stroke-width:3;rx:14}
    .part{fill:#ecfdf5;stroke:#047857;stroke-width:3;rx:12}
    .power{fill:#fff7ed;stroke:#c2410c;stroke-width:3;rx:12}
    text{font-family:Arial,sans-serif;fill:#111827}
    .title{font-size:28px;font-weight:bold}
    .label{font-size:20px;font-weight:bold}
    .small{font-size:16px}
    .pin{font-size:18px;font-weight:bold}
  </style>
  <text x="40" y="48" class="title">IR-Tool – D1 mini Pro / IR-Empfang und Senden</text>
  <text x="40" y="78" class="small">Prinzipdarstellung – Pinbelegung des konkreten Empfängers und Transistors prüfen.</text>

  <rect x="55" y="170" width="300" height="300" class="box"/>
  <text x="205" y="215" text-anchor="middle" class="label">ESP8266 D1 mini Pro</text>
  <text x="205" y="260" text-anchor="middle" class="pin">D5 / GPIO14  ← IR OUT</text>
  <text x="205" y="300" text-anchor="middle" class="pin">D6 / GPIO12  → Senden</text>
  <text x="205" y="355" text-anchor="middle" class="pin">3V3</text>
  <text x="205" y="395" text-anchor="middle" class="pin">5V / VU</text>
  <text x="205" y="435" text-anchor="middle" class="pin">GND</text>

  <rect x="490" y="125" width="250" height="180" class="part"/>
  <text x="615" y="170" text-anchor="middle" class="label">IR-Empfänger</text>
  <text x="615" y="215" text-anchor="middle" class="pin">VCC → 3V3</text>
  <text x="615" y="250" text-anchor="middle" class="pin">OUT → D5</text>
  <text x="615" y="285" text-anchor="middle" class="pin">GND → GND</text>

  <rect x="470" y="430" width="155" height="90" class="part"/>
  <text x="548" y="468" text-anchor="middle" class="label">1 kΩ</text>
  <text x="548" y="500" text-anchor="middle" class="small">Basiswiderstand</text>
  <rect x="700" y="400" width="210" height="150" class="part"/>
  <text x="805" y="440" text-anchor="middle" class="label">NPN</text>
  <text x="805" y="475" text-anchor="middle" class="pin">2N2222 / BC337</text>
  <text x="805" y="510" text-anchor="middle" class="small">E → GND, C → LED</text>
  <rect x="825" y="170" width="220" height="125" class="power"/>
  <text x="935" y="210" text-anchor="middle" class="label">IR-LED</text>
  <text x="935" y="245" text-anchor="middle" class="pin">Anode ← 220 Ω ← 5V/VU</text>
  <text x="935" y="275" text-anchor="middle" class="pin">Kathode → NPN C</text>
  <rect x="55" y="555" width="990" height="75" class="power"/>
  <text x="550" y="600" text-anchor="middle" class="label">Gemeinsame Masse: ESP GND = Empfänger GND = Transistor Emitter</text>

  <path d="M355 260 H410 V250 H490" class="wire"/>
  <path d="M355 300 H420 V475 H470" class="wire"/>
  <path d="M625 475 H700" class="wire"/>
  <path d="M805 400 V335 H935 V295" class="wire"/>
  <path d="M825 232 H760 V395 H355" class="wire"/>
  <path d="M205 355 V115 H615 V125" class="wire"/>
  <path d="M205 395 V105 H935 V170" class="wire"/>
  <path d="M205 435 V555" class="wire"/>
  <path d="M615 285 V555" class="wire"/>
  <path d="M805 550 V555" class="wire"/>
  <circle cx="355" cy="260" r="6" fill="#1f2937"/><circle cx="355" cy="300" r="6" fill="#1f2937"/>
  <circle cx="355" cy="355" r="6" fill="#1f2937"/><circle cx="355" cy="395" r="6" fill="#1f2937"/>
  <circle cx="355" cy="435" r="6" fill="#1f2937"/>
  <text x="70" y="655" class="small">Hinweis: Die Schaltung ist für eine USB-versorgte Platine mit 5V/VU und eine strombegrenzte IR-LED ausgelegt.</text>
</svg>

